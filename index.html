<!DOCTYPE html>
<html>
  <head>
    <title>My Sandbox</title>
    <style>
      body {
        background-color: #f0f8ff; /* A nice soft blue */
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 50px;
      }
      h1 {
        color: #333333;
      }
      p {
        color: #666666;
        font-size: 18px;
      }
      .card {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        width: 50%;
        margin: 0 auto; /* This centers the card */
      }
      .profile-card {
        background-color: #ffffff;
        border: 2px solid #008CBA;
        border-radius: 15px;
        width: 40%;
        margin: 20px auto;
        padding: 15px;
      }

      .tag {
        background-color: #ff9800;
        color: white;
        display: inline-block;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🧸 Hello, World!</h1>
      <p>I just built my first web page to track my Zootopia and Care Bear finds.</p>
      <button onclick="updatePlushie()">Log New Plushie</button>
    </div>

   <div class="profile-card">
      <h2>🦔 Penny Prickles</h2>
      <p class="tag">Exclusive Find</p>
      <p>A very rare, spikey addition to the collection!</p>
    </div>

   <script>
  function updatePlushie() {
    // This grabs the paragraph and changes the text inside it!
    document.querySelector('p').innerText = "Look! I just added a vintage Care Bear to the vault! 🎉";
  }
</script>
  </body>
</html>
